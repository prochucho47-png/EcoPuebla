<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPuebla - Registro</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>🌿 EcoPuebla 🐾</h2>
        <p>Crea una nueva cuenta de Usuario</p>
        
        <!-- Mostrar mensajes de error -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        
        <form method="POST" action="/register">
            <input type="text" name="username" placeholder="Nombre de usuario" required autocomplete="off">
            <input type="email" name="email" placeholder="Correo electrónico" required autocomplete="off">
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn">Registrarse</button>
        </form>
        
        <div style="margin-top:15px; font-size: 0.9em;">
            ¿Ya tienes cuenta? <a href="/login" style="color: #2E7D32; font-weight: bold;">Inicia sesión</a>
        </div>
    </div>
</body>
</html>
