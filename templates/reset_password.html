<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPuebla - Nueva Contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container" style="text-align: left; max-width: 420px; padding: 38px 34px;">
        <div class="login-brand" style="display: flex; justify-content: flex-start; margin-bottom: 18px;">
            <img src="/static/logo.svg" alt="Logo EcoPuebla">
            <div class="login-brand-text"><span>Eco</span>Puebla</div>
        </div>

        <div class="auth-form-header" style="margin-bottom: 18px;">
            <h2 style="margin: 0 0 6px 0; color: #111827;">Nueva contraseña</h2>
            <p>Escribe tu nueva contraseña segura para actualizar tu cuenta.</p>
        </div>
        
        <form method="POST" action="/reset-password/{{ token }}">
            <div class="form-group">
                <label class="form-label" for="newPasswordInput">Nueva contraseña</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                    <input type="password" id="newPasswordInput" name="password" placeholder="Ingresa tu nueva contraseña" required>
                </div>
            </div>

            <button type="submit" class="btn-auth">
                <span>Guardar contraseña</span>
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
    </div>
</body>
</html>
