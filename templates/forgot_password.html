<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPuebla - Recuperar Contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-brand">
            <img src="/static/logo.svg" alt="Logo EcoPuebla">
            <div class="login-brand-text"><span>Eco</span>Puebla</div>
        </div>
        <p style="margin-top: 6px; color: #555;">Recuperar contraseña</p>
        
        <form method="POST" action="/forgot-password">
            <p style="font-size: 0.9em; color:#666; margin-bottom:15px;">
                Ingresa tu correo electrónico registrado y te enviaremos un enlace para restablecer tu contraseña.
            </p>
            <input type="email" name="email" placeholder="Correo electrónico" required autocomplete="off">
            <button type="submit" class="btn">Enviar enlace</button>
        </form>
        
        <div style="margin-top:20px; font-size: 0.9em;">
            <a href="/login" style="color: #2E7D32; font-weight: bold;">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
