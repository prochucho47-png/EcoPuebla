<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPuebla - Recuperar Contraseña</title>
    <link rel="icon" type="image/svg+xml" href="/static/logo.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="auth-box auth-box-centered">
        <div class="login-brand" style="display: flex; justify-content: flex-start; margin-bottom: 18px;">
            <img src="/static/logo.svg" alt="Logo EcoPuebla">
            <div class="login-brand-text"><span>Eco</span>Puebla</div>
        </div>

        <div class="auth-form-header" style="margin-bottom: 20px;">
            <h2>Recuperar contraseña</h2>
            <p>Ingresa tu correo electrónico registrado y te enviaremos un enlace seguro para restablecer tu clave.</p>
        </div>
        
        <form method="POST" action="/forgot-password">
            <div class="form-group">
                <label class="form-label" for="resetEmail">Correo electrónico</label>
                <div class="input-wrapper">
                    <svg class="input-icon" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                    <input type="email" id="resetEmail" name="email" placeholder="Ejemplo: correo@ejemplo.com" required autocomplete="off">
                </div>
            </div>

            <button type="submit" class="btn-auth">
                <span>Enviar enlace de recuperación</span>
                <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
            </button>
        </form>
        
        <div class="auth-switch" style="margin-top: 20px;">
            ¿Recordaste tu contraseña?
            <a href="/login">Volver al inicio de sesión</a>
        </div>
    </div>
</body>
</html>
