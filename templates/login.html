<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoPuebla - Iniciar Sesión</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">
    <div class="login-container">
        <h2>🌿 EcoPuebla 🐾</h2>
        <p>Inicia sesión para continuar</p>
        
        <!-- Mostrar mensajes de error -->
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="alert error">{{ messages[0] }}</div>
          {% endif %}
        {% endwith %}
        
        <form method="POST" action="/login">
            <input type="text" name="username" placeholder="Usuario o Correo Electrónico" required autocomplete="off">
            <input type="password" name="password" placeholder="Contraseña" required>
            <button type="submit" class="btn">Entrar</button>
        </form>
        
        <div style="margin-top:15px; font-size: 0.9em;">
            ¿No tienes cuenta? <a href="/register" style="color: #2E7D32; font-weight: bold;">Regístrate aquí</a>
        </div>
        
        <div style="margin-top:20px; font-size: 0.85em; color:#666; text-align: left; background: #f9f9f9; padding: 10px; border-radius: 5px;">
            <strong>Cuentas de prueba:</strong><br>
            👨‍💻 <b>Admin:</b> admin / admin123<br>
            👤 <b>Usuario:</b> juan / usuario123
        </div>
    </div>
</body>
</html>
